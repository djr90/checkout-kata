name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting (CSharpier)
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (with coverage)
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      # Non-blocking for now: surfaces surviving mutants as a report without failing CI.
      # Flip to a required gate once the score has been stable above the break threshold.
      - name: Mutation testing (Stryker)
        continue-on-error: true
        run: dotnet stryker

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore
